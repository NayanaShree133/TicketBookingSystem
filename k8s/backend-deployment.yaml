apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: ticket-app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
    spec:
      containers:
        - name: backend
          image: 585384908277.dkr.ecr.ap-south-1.amazonaws.com/ticket-backend:latest
          ports:
            - containerPort: 5000
          env:
            - name: DB_HOST
              value: mysql-service
            - name: DB_USER
              value: root
            - name: DB_PASSWORD
              value: root
            - name: DB_NAME
              value: ticketdb
            - name: PORT
              value: "5000"