apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: ticket-app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
    spec:
      containers:
        - name: frontend
          image: 585384908277.dkr.ecr.ap-south-1.amazonaws.com/ticket-frontend:latest
          ports:
            - containerPort: 80